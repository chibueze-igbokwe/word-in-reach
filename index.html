<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Word in Reach Bible study and Scripture discovery workspace." />
  <title>Word in Reach | Home</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body data-page="home">
  <header class="mobile-header">
    <button class="icon-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span data-icon="menu"></span></button>
    <a class="wordmark" href="./">Word in Reach</a>
    <span class="avatar" aria-hidden="true">W</span>
  </header>
  <nav class="mobile-menu" id="mobile-menu" aria-label="Menu" hidden>
    <a href="./bible.html">Bible</a>
    <a href="./search.html">Search</a>
    <a href="./saved.html">Saved verses</a>
  </nav>

  <main class="mobile-home">
    <form class="global-search" id="home-search">
      <label class="sr-only" for="home-query">Search passage, topic, or keyword</label>
      <input id="home-query" type="search" placeholder="Search passage, topic, or keyword..." />
    </form>

    <section class="home-section">
      <div class="section-title-row">
        <h1>Daily Discovery</h1>
      </div>
      <article class="daily-card" aria-live="polite">
        <div class="daily-art" aria-hidden="true"><span data-icon="sparkles"></span></div>
        <div>
          <p class="eyebrow" id="daily-topic">TODAY'S PASSAGE</p>
          <h2 id="daily-reference">Loading daily passage...</h2>
          <p id="daily-description">Finding a passage from GetBible Topics.</p>
        </div>
      </article>
      <a class="primary-action" id="daily-link" href="./bible.html" hidden>Explore This Passage <span data-icon="arrow-right"></span></a>
      <button class="secondary-action" id="daily-retry" type="button" hidden>Try again</button>
    </section>

    <section class="home-section">
      <div class="section-title-row">
        <h2>Continue Studying</h2>
        <a href="./bible.html">View all</a>
      </div>
      <div class="compact-list" id="recent-list"></div>
    </section>

    <section class="home-section" id="topics">
      <div class="section-title-row">
        <h2>Topics to Explore</h2>
        <a href="./search.html">View all</a>
      </div>
      <div class="topic-grid" id="topic-grid">Loading topics...</div>
    </section>

    <section class="home-section">
      <div class="section-title-row">
        <h2>Recent Study</h2>
        <a href="./saved.html#recent-study">View all</a>
      </div>
      <div class="compact-list" id="recent-study-list"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a class="active" href="./"><span data-icon="house"></span>Home</a>
    <a href="./bible.html"><span data-icon="book-open"></span>Bible</a>
    <a href="./#topics"><span data-icon="compass"></span>Discover</a>
    <a href="./search.html"><span data-icon="search"></span>Search</a>
    <a href="./saved.html"><span data-icon="heart"></span>Saved</a>
  </nav>
</body>
</html>
