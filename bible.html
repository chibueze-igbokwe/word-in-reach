<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Word in Reach Scripture study workspace." />
  <title>Word in Reach | Scripture Study</title>
  <script type="module" src="/src/study.js"></script>
</head>
<body data-page="bible">
  <header class="desktop-header">
    <a class="desktop-brand" href="./"><span class="brand-icon">W</span><strong>Word in Reach</strong></a>
    <form class="desktop-search" id="desktop-search">
      <input id="desktop-query" type="search" placeholder="Search passage, topic, or keyword..." aria-label="Search passage, topic, or keyword" />
    </form>
    <span class="avatar" aria-hidden="true">W</span>
  </header>

  <header class="reader-mobile-header">
    <a href="./" aria-label="Back home"><span data-icon="chevron-left"></span></a>
    <strong id="mobile-reference">John 3:16</strong>
    <button id="mobile-save" type="button" aria-label="Save passage"><span data-icon="heart"></span></button>
  </header>

  <div class="workspace-tabs" id="passage-tabs" role="tablist" aria-label="Open passages"></div>

  <main class="study-layout">
    <aside class="bible-sidebar">
      <div class="sidebar-title"><span data-icon="book-open"></span><strong>Bible</strong><button type="button" aria-label="Collapse sidebar"><span data-icon="chevron-up"></span></button></div>
      <section>
        <h2>Old Testament</h2>
        <div class="book-list" id="old-books"><p>Loading books...</p></div>
      </section>
      <section>
        <h2>New Testament</h2>
        <div class="book-list" id="new-books"></div>
      </section>
    </aside>

    <section class="reader-column">
      <button class="mobile-browse" id="mobile-browse" type="button" aria-expanded="false">Browse books and chapters</button>
      <div class="reader-mobile-open-tabs">
        <span id="open-passage-count">Open Passages (1)</span>
        <button id="toggle-mobile-tabs" type="button" aria-label="Toggle open passages" aria-expanded="true"><span data-icon="chevron-up"></span></button>
      </div>

      <div class="mobile-tab-strip" id="mobile-tabs"></div>

      <div class="study-subnav">
        <button class="active" type="button">Passage</button>
        <button type="button">Words</button>
        <button type="button">Commentary</button>
        <button type="button">Cross References</button>
      </div>

      <div class="reader-toolbar">
        <select id="translation" aria-label="Translation">
          <option value="kjv">KJV</option>
        </select>
        <span class="toolbar-spacer"></span>
        <button type="button" aria-label="Listen"><span data-icon="volume-2"></span></button>
        <button id="save-passage" type="button" aria-label="Save passage"><span data-icon="heart"></span></button>
        <button type="button" aria-label="Share passage"><span data-icon="share-2"></span></button>
        <button type="button" aria-label="More options"><span data-icon="ellipsis"></span></button>
      </div>

      <article class="scripture-reader">
        <div class="reader-title-row">
          <h1 id="active-reference">John 3:16</h1>
          <select aria-label="Translation"><option>KJV</option></select>
        </div>
        <div id="scripture-text" class="verse-list" aria-live="polite"></div>
        <p class="reader-status" id="reader-status" aria-live="polite">Loading passage...</p>
      </article>

      <section class="related-section">
        <div class="section-title-row"><h2>Related Verses</h2><button id="view-cross-references" type="button">View all</button></div>
        <div class="compact-list" id="related-verses" aria-live="polite"></div>
      </section>
    </section>

    <aside class="study-panel">
      <div class="panel-tabs">
        <button class="active" type="button">Words</button>
        <button type="button">Commentary</button>
        <button type="button">Cross References</button>
      </div>
      <div class="study-content" id="study-content" aria-live="polite"></div>
    </aside>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a href="./"><span data-icon="house"></span>Home</a>
    <a class="active" href="./bible.html"><span data-icon="book-open"></span>Bible</a>
    <a href="./#topics"><span data-icon="compass"></span>Discover</a>
    <a href="./search.html"><span data-icon="search"></span>Search</a>
    <a href="./saved.html"><span data-icon="heart"></span>Saved</a>
  </nav>
</body>
</html>
